<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7fb"><title>Copello | Consorcios</title><link rel="stylesheet" href="styles.css"><script src="config.js" defer></script><script src="app.js" defer></script></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"><a class="brand" href="#" id="brand-link"><span class="brand-mark">C</span><span id="brand-name">Copello</span></a><div class="side-label">GESTIÓN</div><button class="nav-item active" data-view="dashboard"><span class="nav-icon">▦</span>Resumen</button><button class="nav-item" data-view="buildings"><span class="nav-icon">▤</span>Consorcios</button><button class="nav-item" data-view="payments"><span class="nav-icon">↗</span>Pagos y comprobantes</button><div class="sidebar-bottom"><div class="user-chip"><div class="avatar">C</div><div><strong>Administración</strong><small>Espacio de trabajo</small></div></div><button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Apariencia y ajustes</button></div></aside>
<main class="main-area"><header class="topbar"><button class="mobile-menu" id="mobile-menu" aria-label="Abrir menú">☰</button><div class="breadcrumb"><span>Copello</span><span class="crumb-sep">/</span><strong id="page-label">Resumen</strong></div><div class="topbar-right"><span class="status-dot"></span><span>Espacio privado</span></div></header><div class="content" id="app-content"></div></main></div>
<div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-heading"><div><p class="eyebrow">COPELLO / CONSORCIOS</p><h2 id="modal-title">Agregar consorcio</h2></div><button class="icon-button" id="close-modal" aria-label="Cerrar">×</button></div><form id="building-form"><label for="building-name">Nombre del edificio *</label><input id="building-name" name="name" required maxlength="80" placeholder="Ej. Consorcio San Martín"><label for="building-address">Dirección</label><input id="building-address" name="address" maxlength="140" placeholder="Calle, número, localidad"><div class="form-row"><div><label for="building-units">Cantidad de unidades</label><input id="building-units" name="units" type="number" min="0" max="9999" value="0"></div><div><label for="building-color">Color identificador</label><input id="building-color" name="color" type="color" value="#3978f6"></div></div><label for="building-notes">Notas (opcional)</label><textarea id="building-notes" name="notes" rows="3" maxlength="500" placeholder="Información general del consorcio"></textarea><div class="form-actions"><button type="button" class="secondary-button" id="cancel-modal">Cancelar</button><button type="submit" class="primary-button">Guardar consorcio</button></div></form></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div></body></html>
